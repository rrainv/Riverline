<script>
/* ---- Riverline explore core: exact Hold'em evaluator + enumerating equity (prototype-only, no engine/ imports) ---- */
const RANKS = '23456789TJQKA';
const SUITS = 'cdhs';
const SUIT_GLYPH = { c: '♣', d: '♦', h: '♥', s: '♠' };
const card = (s) => RANKS.indexOf(s[0]) * 4 + SUITS.indexOf(s[1]);
const rankOf = (c) => c >> 2;
const suitOf = (c) => c & 3;
const cardStr = (c) => RANKS[c >> 2] + SUITS[c & 3];
const isRed = (c) => (c & 3) === 1 || (c & 3) === 2;

/* score: category<<20 | packed kickers (4 bits each). Higher is better. */
function evalHand(cs) {
  const rc = new Int8Array(13), sm = [0, 0, 0, 0], sc = [0, 0, 0, 0];
  let rmask = 0;

/* Exact equity of hero vs every villain combo, enumerating every runout.

function equityExact(hero, board, combos, opts) {
  opts = opts || {};

  const live = combos.filter((c) => !dead.has(c[0]) && !dead.has(c[1]));
  const deck = []; for (let c = 0; c < 52; c++) if (!dead.has(c)) deck.push(c);
  const need = 5 - board.length;
  // Enumerate runouts once; hero score once per runout; villain scored per non-colliding combo.
  const runouts = [];
  if (need === 0) runouts.push([]);
  else if (need === 1) for (let i = 0; i < deck.length; i++) runouts.push([deck[i]]);
  else if (need === 2) for (let i = 0; i < deck.length; i++) for (let j = i + 1; j < deck.length; j++) runouts.push([deck[i], deck[j]]);
  const res = { win: 0, tie: 0, lose: 0, total: 0 };
  const cl = live.length;
  let idx = 0;
  const step = () => {
    const t0 = performance.now();
    while (idx < runouts.length && performance.now() - t0 < 12) {
      const ro = runouts[idx++];
      const full = board.concat(ro);
      const hs = evalHand(hero.concat(full));
      for (let k = 0; k < cl; k++) {
        const v = live[k];
        let hit = false;
        for (let q = 0; q < ro.length; q++) if (ro[q] === v[0] || ro[q] === v[1]) { hit = true; break; }
        if (hit) continue;
        const vs = evalHand([v[0], v[1], ...full]);
        if (hs > vs) res.win++; else if (hs < vs) res.lose++; else res.tie++;
        res.total++;
      }
    }
    if (opts.onProgress) opts.onProgress(idx / Math.max(1, runouts.length));
  };
  return new Promise((resolve) => {
    if (cl === 0) { resolve({ ...res, equity: NaN, combos: 0 }); return; }
    const tick = () => {
      if (opts.cancelled && opts.cancelled()) { resolve(null); return; }
      step();
      if (idx >= runouts.length) {
        resolve({ ...res, equity: (res.win + res.tie / 2) / res.total, combos: cl });
      } else setTimeout(tick, 0);
    };
    tick();
  });
}

  const vcards = src.cards ? `<div class="cards">${src.cards.map((c) => cardEl(c, 'sm')).join('')}</div>` : `<div class="cards">${backEl('xs')}${backEl('xs')}</div><div class="sub">${live} combos</div>`;
  const vill = `<div class="eqrow"><div class="who"><b style="color:var(--overlay-ink);font-size:var(--fs-body)">BB</b><span>${src.label}</span></div><div>${vcards}</div><div class="big" id="villBig">${r ? '' : '…'}</div></div>`;
  const bars = `<div class="eqrow" style="grid-template-columns:86px minmax(0,1fr) 74px;padding-top:0;border-top:0"><span></span><div><div class="bar tall" style="display:flex"><i class="hero-fill" id="bH" style="width:100%;transform:scaleX(0)"></i></div><div class="bar tall" style="margin-top:6px"><i class="vill-fill" id="bV" style="width:100%;transform:scaleX(0)"></i></div><div class="sub" id="split">${r ? '' : 'Counting every runout…'}</div></div><span></span></div>`;
  rows.innerHTML = hero + vill + bars + (r ? '' : '<div class="shim"></div>');
  if (r) paintResult(true);
}

function paintResult(initial) {
  const r = S.res; if (!r) return;
  const e = r.equity, to = (id, v, fmt) => { const el = $(id); if (!el) return; countTo(el, v, fmt); };
  countTo($('#heroBig'), e * 100, (x) => x.toFixed(1) + '%');
  countTo($('#villBig'), (1 - e) * 100, (x) => x.toFixed(1) + '%');
  countTo($('#eqv'), e * 100, (x) => x.toFixed(1) + '%');
  const from = S.prevEq == null ? 0 : S.prevEq;
  const bH = $('#bH'), bV = $('#bV');
  if (bH) { bH.style.transform = `scaleX(${from})`; bV.style.transform = `scaleX(${1 - from})`; requestAnimationFrame(() => requestAnimationFrame(() => { bH.style.transform = `scaleX(${e})`; bV.style.transform = `scaleX(${1 - e})`; })); }
  const sp = $('#split'); if (sp) sp.innerHTML = `You win <b class="num">${pct(r.win / r.total)}</b> · tie <b class="num">${r.tie > 0 && r.tie / r.total < 0.0005 ? '<0.1%' : pct(r.tie / r.total)}</b> · lose <b class="num">${pct(r.lose / r.total)}</b> · ${r.total.toLocaleString('en-US')} runouts counted`;
  S.prevEq = e;
}
function countTo(el, to, fmt) {
  if (!el) return;
  const ms = cssMs('--dur-3'), t0 = performance.now(), from = parseFloat(el.dataset.v || '0');
  el.dataset.v = to;
  const f = (now) => { const k = Math.min(1, (now - t0) / ms); el.textContent = fmt(from + (to - from) * k); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

function drawTrail() {
  const tr = $('#trail'); if (!tr) return;
  const { sc, o } = cur(), bd = boardNow(), dead = new Set([...sc.hero, ...bd]);
  let html = '', i = 0;
  const suitOrder = [3, 2, 1, 0];
  for (const s of suitOrder) for (let r = 12; r >= 0; r--) {
    const c = r * 4 + s; i++;
    if (dead.has(c)) { html += `<span class="tc dead" style="--i:${i}"></span>`; continue; }
    if (srcOf().cards && srcOf().cards.includes(c)) { html += `<span class="tc dead" style="--i:${i}" title="His card"><b>${RANKS[r].replace('T', '10')}${SUIT_GLYPH[SUITS[s]]}</b><span>his</span></span>`; continue; }
    const t = S.trail[c];
    const cls = t ? (t.d >= 0 ? 'up' : 'dn') : 'pend';
    const hh = t ? Math.min(70, Math.round(Math.abs(t.d) * 220)) : 0;
    html += `<button class="tc ${isRed(c) ? 'red' : ''} ${cls}" data-t="${c}" style="--i:${i};--h:${hh}%" aria-label="${cardStr(c)}"><b>${RANKS[r].replace('T', '10')}${SUIT_GLYPH[SUITS[s]]}</b><span>${t ? Math.round(t.e * 100) : '·'}</span></button>`;
  }
  tr.innerHTML = html;
  tr.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => { cur().o.board.push(+b.dataset.t); S.prevEq = S.res ? S.res.equity : null; renderOv(); run(); }));
}

async function run() {
  if (unavailableNow() || lockedNow()) return;
  const my = ++job, { sc } = cur(), src = srcOf(), bd = boardNow();
  S.res = null; S.trail = {};
  const r = await equityExact(sc.hero, bd, src.combos, { cancelled: () => my !== job });
  if (my !== job || !r) return;
  S.res = r; drawRows();
  if (bd.length >= 5) return;
  const deck = []; const dead = new Set([...sc.hero, ...bd]);
  for (let s = 3; s >= 0; s--) for (let rk = 12; rk >= 0; rk--) { const c = rk * 4 + s; if (!dead.has(c)) deck.push(c); }
  for (const c of deck) {
    if (my !== job) return;
    const t = await equityExact(sc.hero, bd.concat([c]), src.combos, { cancelled: () => my !== job });
    if (my !== job || !t) return;
    if (!(t.combos > 0)) continue;
    S.trail[c] = { e: t.equity, d: t.equity - r.equity };
    const b = document.querySelector(`[data-t="${c}"]`);
    if (b) { const hh = Math.min(70, Math.round(Math.abs(S.trail[c].d) * 220)); b.classList.remove('pend'); b.classList.add(S.trail[c].d >= 0 ? 'up' : 'dn'); b.style.setProperty('--h', hh + '%'); b.querySelector('span').textContent = Math.round(t.equity * 100); }
  }
}

function wireOv() {
  $('#ovx').addEventListener('click', closeOv);
  $('#back')?.addEventListener('click', () => { const o = cur().o; o.board.pop(); S.prevEq = S.res ? S.res.equity : null; renderOv(); run(); });
  document.querySelectorAll('[data-src]').forEach((b) => b.addEventListener('click', () => { cur().o.src = b.dataset.src; cur().o.board = []; S.prevEq = S.res ? S.res.equity : null; renderOv(); run(); }));
  $('#toRoom')?.addEventListener('click', () => toast('Would open Equity with this exact state. Not wired in this prototype.'));
  $('#pin')?.addEventListener('click', () => {
    const r = S.res; if (!r) return; const src = srcOf(), bd = boardNow();
    S.notes[S.room].push(`<b>${streetName(bd.length)}</b> · equity <b class="num">${pct(r.equity)}</b> vs ${src.label.toLowerCase()} <span class="tier ${src.tier}" style="margin-inline-start:4px">${src.tierText}</span>`);
    renderScene(); toast('Pinned to this decision. The overlay stays open.');
  });
  const h = $('#ovh'); let drag = null;
  h.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; const ov = $('#ov'); drag = { x: e.clientX, y: e.clientY, dx: parseFloat(ov.style.getPropertyValue('--dx')) || 0, dy: parseFloat(ov.style.getPropertyValue('--dy')) || 0 }; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', (e) => { if (!drag) return; const ov = $('#ov'); ov.style.setProperty('--dx', drag.dx + e.clientX - drag.x + 'px'); ov.style.setProperty('--dy', drag.dy + e.clientY - drag.y + 'px'); });
  h.addEventListener('pointerup', () => { drag = null; });
}

function openOv() { const el = $('#ov'); S.open = true; S.prevEq = null; $('#stage').classList.add('has-ov'); el.dataset.open = 'true'; el.classList.remove('closing'); renderOv(); run(); $('#ovx').focus(); }
function closeOv() { const el = $('#ov'); S.open = false; job++; $('#stage').classList.remove('has-ov'); el.classList.add('closing'); setTimeout(() => { el.dataset.open = 'false'; el.classList.remove('closing'); }, cssMs('--dur-2')); document.querySelector('#openEq')?.focus(); }
function toast(t) { document.querySelectorAll('.toast').forEach((x) => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ============ Chrome ============ */
function renderTabs() {
  $('#rooms').innerHTML = Object.keys(SCENES).map((k) => `<button class="tab" role="tab" data-room="${k}" aria-selected="${S.room === k}">${SCENES[k].name}</button>`).join('');
  $('#rooms').querySelectorAll('[data-room]').forEach((b) => b.addEventListener('click', () => { S.room = b.dataset.room; S.res = null; S.prevEq = null; renderTabs(); renderScene(); if (S.open) { renderOv(); run(); } }));
}
$('#themes').innerHTML = ['midnight', 'felt', 'daylight', 'paper'].map((t) => `<button class="chip" data-th="${t}" aria-pressed="${t === 'midnight'}">${t}</button>`).join('');
$('#themes').querySelectorAll('[data-th]').forEach((b) => b.addEventListener('click', () => { document.documentElement.dataset.theme = b.dataset.th; $('#themes').querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', x === b)); }));
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'e' || e.key === 'E') { if (!S.open) openOv(); else closeOv(); }
  if (e.key === 'Escape' && S.open) closeOv();
});
$('#hint').innerHTML = [
  ['One overlay, one control', 'Review, Hand and Training open the same component. The room only supplies the cards, the board and the price.'],
  ['Honest labels', 'Green means Exact, brass means your assumption, dashed means Unavailable. One badge per panel, never a percentage of confidence.'],
  ['Training stays a drill', 'Before you answer, the overlay shows only the Exact price. Equity unlocks after you confirm.'],
  ['Nothing is lost', 'Step the board with a click, go back a card, pin the number to the decision. The room behind is still there.'],
].map(([h, t]) => `<div class="panel rise"><div class="lbl">${h}</div><p class="t2" style="margin-top:6px;font-size:var(--fs-small)">${t}</p></div>`).join('');
renderTabs(); renderScene();
</script>
</body>
</html>
